site_name: CRM → Ops move-in handoff
site_url: https://dakshvanshaj.com/union-living-ops-handoff/
repo_url: https://github.com/dakshvanshaj/union-living-ops-handoff
nav:
  - Overview: index.md
  - How it works: how-it-works.md
  - Set it up: setup.md
theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/brightness-7, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/brightness-4, name: Light mode }
  features: [content.code.copy]
markdown_extensions:
  - tables
  - attr_list
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
